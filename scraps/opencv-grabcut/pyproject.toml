[project]
name = "opencv-grabcut"
version = "0.1.0"
description = "Standalone GrabCut measurements and experiments"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["numpy", "opencv-python"]

[dependency-groups]
dev = ["ruff", "ty"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["sandbox/results", "results", "tests/results"]

# 構文・未使用名・インポート順だけを確認する。構造や記法を過剰に縛らない。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = ["sandbox/results", "results", "tests/results"]

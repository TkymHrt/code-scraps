[project]
name = "opencv-grabcut"
version = "0.1.0"
description = "GrabCut scrap"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "numpy",
  "opencv-python",
]

[dependency-groups]
dev = [
  "ruff",
  "ty",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
# 検証で保存したスクリプトのコピーは、元コードと二重にチェックしない。
extend-exclude = ["experiments/results", "practical/**/results"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "W",   # pycodestyle warnings
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "A",   # builtins shadow
  "C4",  # comprehensions
  "D",   # pydocstyle
  "DTZ", # datetime
  "EM",  # exception message
  "FA",  # future annotations
  "G",   # logging format
  "INP", # implicit namespace package
  "PERF",# performance
  "PIE", # misc lints
  "PL",  # pylint
  "Q",   # quotes
  "RET", # return
  "RUF", # ruff-specific
  "S",   # bandit
  "SIM", # simplify
  "TID", # tidy imports
  "T20", # print
  "TRY", # tryceratops
  "YTT", # sys version
  "NPY", # numpy
  "FBT", # boolean trap
]
# D203 は D211 と、D213 は D212 と競合するため明示的に除外（ruff の自動解決と同じ）
ignore = ["D203", "D213"]

[tool.ty.rules]
all = "error"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
exclude = ["experiments/results", "practical/**/results"]
